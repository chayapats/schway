language: node_js
node_js: "22"
os: linux
dist: jammy

addons:
  apt:
    packages:
      - ripgrep
      - unzip

before_install:
  - curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
  - export PATH="$HOME/.bun/bin:$PATH"
  - bun --version
  - rg --version

install:
  - bun install --frozen-lockfile

script:
  - bun run typecheck
  - bun test
