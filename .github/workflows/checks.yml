name: checks
# Typecheck and the full test suite run on GitHub-hosted runners, which are free for this
# public repository, so long suites don't load a developer machine. Every push to a branch
# of this repository runs once, including main after a merge, and its PR shows those
# checks. Fork branches don't run here: push the branch to this repository or use
# workflow_dispatch. A newer push to the same ref cancels the older run.
# Tests run on x64 and on ARM64, which matches the Raspberry Pi hosts that embed Schway.
# Shards are balanced by the per-file timings in scripts/ci/test-timings.json; each shard uploads
# a junit-<arch>-<shard> report, and scripts/ci/README.md shows how to refresh the table from them.
# x64 shards run from a copy of the checkout without .git and fail if the tests removed anything
# they didn't create (#450). Pushes to main and manual runs also pack the tested commit as a
# workflow artifact for Jit to vendor (docs/host-s14-conformance.md).
on:
  push:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
  tests:
    name: tests (${{ matrix.arch }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # The search tool prefers ripgrep; tests that drive Git need a committer identity.
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ripgrep
      - run: git config --global user.name "schway-ci" && git config --global user.email "schway-ci@users.noreply.github.com"
      # The shard count argument must match the matrix above.
      - name: List the shard's files
        run: bun scripts/ci/test-shard.ts ${{ matrix.shard }} 4 | tee "$RUNNER_TEMP/shard-files.txt"
      - name: Copy the checkout without .git
        if: matrix.arch == 'x64'
        run: bash scripts/ci/no-git-copy.sh prepare /tmp/schway-no-git
      # Shared runners can exceed Bun's default 5 s per test under parallel load.
      - name: Run the shard
        working-directory: ${{ matrix.arch == 'x64' && '/tmp/schway-no-git' || github.workspace }}
        run: bun test --timeout 30000 --reporter=junit --reporter-outfile="$RUNNER_TEMP/junit.xml" $(cat "$RUNNER_TEMP/shard-files.txt")
      - name: Check that the tests removed nothing they didn't create
        if: always() && matrix.arch == 'x64'
        run: bash scripts/ci/no-git-copy.sh verify /tmp/schway-no-git
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.arch }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: ignore
          retention-days: 30
  package:
    # Jit vendors this tarball. It is packed only from a commit whose typecheck and tests passed,
    # kept as a workflow artifact with its SHA-256 file, and never sent to a registry.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [typecheck, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ripgrep
      - name: Pack, checksum and install in the packed-consumer test
        id: pack
        run: bash scripts/ci/pack-artifact.sh "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            ${{ steps.pack.outputs.dir }}/${{ steps.pack.outputs.name }}.tgz
            ${{ steps.pack.outputs.dir }}/${{ steps.pack.outputs.name }}.tgz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  checks:
    if: always()
    needs: [typecheck, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.typecheck.result }}" = success && test "${{ needs.tests.result }}" = success
