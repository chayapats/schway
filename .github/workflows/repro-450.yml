name: repro-450
# TEMPORARY (#450): reproduce a test deleting outside its temp root when the suite runs from a copy without .git.
on:
  push:
    branches: [t3/fix-ci-test-safety-shard-artifacts]
concurrency:
  group: repro-450-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  per-file:
    name: per-file (${{ matrix.layout }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        layout: [copy, symlink]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ripgrep
      - run: git config --global user.name "schway-ci" && git config --global user.email "schway-ci@users.noreply.github.com"
      - run: bash scripts/ci/repro-450.sh per-file ${{ matrix.layout }} ${{ matrix.shard }}
  suite:
    name: suite (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [container, host]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: docker pull oven/bun:1.4.2
        if: matrix.variant == 'container'
      - run: git config --global user.name "schway-ci" && git config --global user.email "schway-ci@users.noreply.github.com"
      - run: bash scripts/ci/repro-450.sh suite ${{ matrix.variant }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-450-suite-${{ matrix.variant }}
          path: |
            /tmp/suite.log
            /tmp/watch.log
            /tmp/repro-report.txt
          if-no-files-found: ignore
