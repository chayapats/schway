# Disable automatic project .env loading so credentials do not change
# merely because the user entered another repository.
env = false

[run]
# Keep source CLI output identical to the installed launcher.
silent = true

[test]
root = "."
# Pin the credential-store lock to a per-run temporary file (see the preload).
preload = ["./tests/fixtures/credential-store-lock/isolate-preload.ts"]
